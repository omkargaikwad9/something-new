{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1>Welcome</h1>
{% if current_user.is_authenticated %}
  <p>Hello, {{ current_user.name or current_user.email }} — <a href="{{ url_for('profile') }}">Profile</a></p>
{% else %}
  <p>Please <a href="{{ url_for('login') }}">login</a> or <a href="{{ url_for('register') }}">register</a>.</p>
{% endif %}
{% endblock %}
